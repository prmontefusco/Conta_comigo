# Firebase App Hosting - PRODUCTION configuration.
#
# This file is read when a real backend is built and deployed. It intentionally
# contains no secrets: every sensitive value must be a Secret Manager reference.
# See docs/LOCAL_DEVELOPMENT.md before changing anything here.

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Public Firebase Web SDK configuration. These identifiers are not secrets:
  # access control is enforced by Firestore Security Rules, never by hiding them.
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REPLACE_WITH_PRODUCTION_PROJECT_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE_WITH_PRODUCTION_API_KEY
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REPLACE_WITH_PRODUCTION_AUTH_DOMAIN
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REPLACE_WITH_PRODUCTION_APP_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: REPLACE_WITH_PRODUCTION_SENDER_ID
    availability: [BUILD, RUNTIME]

  # Emulators are never used in production.
  - variable: NEXT_PUBLIC_USE_FIREBASE_EMULATORS
    value: "false"
    availability: [BUILD, RUNTIME]

  # AdSense. Real ad scripts only ever load in production (docs/ADSENSE.md).
  - variable: NEXT_PUBLIC_ADS_ENABLED
    value: "true"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_ADSENSE_CLIENT_ID
    value: REPLACE_WITH_ADSENSE_CLIENT_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SITE_URL
    value: REPLACE_WITH_PUBLIC_SITE_URL
    availability: [BUILD, RUNTIME]

  # Firebase App Check. Raises the cost of automated abuse; it never replaces
  # the Security Rules. Leave empty to keep it off; see docs/SECURITY.md.
  - variable: NEXT_PUBLIC_APPCHECK_SITE_KEY
    value: REPLACE_WITH_RECAPTCHA_V3_SITE_KEY
    availability: [BUILD, RUNTIME]

  # ── Pagamentos ─────────────────────────────────────────────────────────────
  # RUNTIME apenas, sempre. Uma chave de pagamento em BUILD acabaria no bundle
  # servido ao navegador, e quem a tivesse emitiria cobranças em seu nome.
  #
  # Cada uma falha fechada quando ausente:
  #   ASAAS_API_KEY           ausente → checkout desabilitado, API responde 503
  #   PAYMENT_WEBHOOK_SECRET  ausente → webhook recusa toda requisição (503)
  #
  # Crie os segredos antes de descomentar:
  #   npx firebase apphosting:secrets:set ASAAS_API_KEY
  #   npx firebase apphosting:secrets:set PAYMENT_WEBHOOK_SECRET
  #
  # O mesmo segredo precisa ser cadastrado no painel do Asaas, em
  # Integrações → Webhooks, como cabeçalho `asaas-access-token`.
  #
  # - variable: ASAAS_API_KEY
  #   secret: ASAAS_API_KEY
  #   availability: [RUNTIME]
  # - variable: PAYMENT_WEBHOOK_SECRET
  #   secret: PAYMENT_WEBHOOK_SECRET
  #   availability: [RUNTIME]
  #
  # Sandbox: https://api-sandbox.asaas.com/v3
  - variable: ASAAS_API_BASE_URL
    value: https://api.asaas.com/v3
    availability: [RUNTIME]

  # Preços em centavos inteiros. Não são segredo — aparecem na tela de planos —
  # mas ficam só no servidor: assim existe uma única fonte de verdade, a mesma
  # que o checkout usa para cobrar. Um preço público e um de cobrança poderiam
  # divergir, e a tela mostraria um valor diferente do debitado.
  #
  # Mudar o preço é editar isto e reimplantar; não exige alterar código.
  # Um valor inválido ou ausente fecha a venda daquele ciclo, em vez de virar
  # zero: é melhor não vender do que vender pelo preço errado.
  - variable: SUBSCRIPTION_PRICE_MONTHLY_CENTS
    value: "500" # R$ 5,00 por mês
    availability: [RUNTIME]
  - variable: SUBSCRIPTION_PRICE_YEARLY_CENTS
    value: "5000" # R$ 50,00 por ano (equivale a R$ 4,17/mês)
    availability: [RUNTIME]

  # ── Consultoria com IA ─────────────────────────────────────────────────────
  # RUNTIME apenas. Uma chave de modelo em BUILD acabaria no bundle servido ao
  # navegador, e quem a tivesse gastaria a cota em seu nome.
  #
  # Ausente → a consultoria responde pelo motor determinístico local, sem custo
  # por token. É degradação silenciosa e intencional: o produto continua de pé.
  #
  # Crie o segredo antes de descomentar:
  #   npx firebase apphosting:secrets:set GEMINI_API_KEY
  #
  # - variable: GEMINI_API_KEY
  #   secret: GEMINI_API_KEY
  #   availability: [RUNTIME]
  #
  # Trocar de modelo não deve exigir reimplantar código — só editar isto.
  # Confirme o nome na documentação do provedor antes de ligar: um modelo
  # inexistente cai no motor local e registra o status 404 no log.
  - variable: GEMINI_MODEL
    value: gemini-2.5-flash
    availability: [RUNTIME]
